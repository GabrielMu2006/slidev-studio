name: Test
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/release.py validate
      - run: python -m unittest discover -s plugins/slidev-studio/tests -v
      - run: python -m unittest discover -s tests -v
      - run: python scripts/release.py build
